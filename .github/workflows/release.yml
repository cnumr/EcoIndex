name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump type'
        type: choice
        required: true
        default: minor
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    name: Bump version, commit and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous_tag: ${{ steps.previous_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Find previous tag
        id: previous_tag
        run: |
          # Only tags reachable from HEAD (ignores Hugo tags from unrelated history).
          PREVIOUS_TAG=$(git describe --tags --match 'v*.*.*' --abbrev=0 2>/dev/null || true)
          echo "tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "${PREVIOUS_TAG}" ]; then
            echo "Previous tag: ${PREVIOUS_TAG}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No previous tag found on this history (first Astro release)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Bump package.json version
        id: bump
        run: |
          VERSION=$(bun -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const [a, b, c] = p.version.split('.').map(Number);
            const bump = process.env.BUMP;
            if (bump === 'major') p.version = \`\${a + 1}.0.0\`;
            else if (bump === 'minor') p.version = \`\${a}.\${b + 1}.0\`;
            else p.version = \`\${a}.\${b}.\${c + 1}\`;
            fs.writeFileSync('package.json', JSON.stringify(p, null, '\t') + '\n');
            process.stdout.write(p.version);
          ")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped version to ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
        env:
          BUMP: ${{ inputs.bump }}

      - name: Commit and tag
        uses: EndBug/add-and-commit@f68b41bfefb2ed558185ab6ab97b620866ebe369 # v11.1.1
        with:
          add: package.json
          message: 'chore: bump version to ${{ steps.bump.outputs.version }}'
          tag: v${{ steps.bump.outputs.version }}
          push: true

  deploy:
    name: Build and deploy to production
    needs: bump
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.bump.outputs.version }}

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install SSH Key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.RSYNC_PRIVATE_SSH_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.RSYNC_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          echo "Deploying v${{ needs.bump.outputs.version }} to production" >> "$GITHUB_STEP_SUMMARY"
          rsync -rpzv --exclude="screenshots" -e 'ssh -p ${{ secrets.RSYNC_REMOTE_PORT }}' './dist/' ${{ secrets.RSYNC_REMOTE_USER }}@${{ secrets.RSYNC_REMOTE_HOST }}:${{ secrets.RSYNC_REMOTE_FOLDER }}

  release:
    name: Create GitHub Release
    needs: [bump, deploy]
    runs-on: ubuntu-latest
    env:
      MATTERMOST_RELEASE_URL: ${{ secrets.MATTERMOST_RELEASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.bump.outputs.version }}

      - name: Generate changelog
        id: changelog
        if: ${{ needs.bump.outputs.previous_tag != '' }}
        continue-on-error: true
        uses: requarks/changelog-action@7ce6be4c4d2233ae2a943694ca34f23aeafa1054 # v1.11.0
        with:
          token: ${{ github.token }}
          fromTag: v${{ needs.bump.outputs.version }}
          toTag: ${{ needs.bump.outputs.previous_tag }}
          writeToFile: false

      - name: Write changelog file
        run: |
          if [ -n "${{ steps.changelog.outputs.changes }}" ]; then
            echo "${{ steps.changelog.outputs.changes }}" > /tmp/changelog.md
          elif [ -n "${{ needs.bump.outputs.previous_tag }}" ]; then
            {
              echo "## v${{ needs.bump.outputs.version }}"
              echo ""
              echo "Release v${{ needs.bump.outputs.version }} (changelog unavailable between \`${{ needs.bump.outputs.previous_tag }}\` and this tag)."
            } > /tmp/changelog.md
          else
            {
              echo "## v${{ needs.bump.outputs.version }}"
              echo ""
              echo "First release on the Astro codebase."
            } > /tmp/changelog.md
          fi

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          makeLatest: true
          name: v${{ needs.bump.outputs.version }}
          tag: v${{ needs.bump.outputs.version }}
          token: ${{ github.token }}
          bodyFile: /tmp/changelog.md

      - name: Notify Mattermost
        if: ${{ env.MATTERMOST_RELEASE_URL != '' }}
        run: |
          echo "{\"icon_url\":\"https://icon-library.com/images/github-icon-png/github-icon-png-29.jpg\",\"text\":\":tada: Une nouvelle release a été publiée pour le projet **${{ github.repository }}: v${{ needs.bump.outputs.version }}** :tada: \\n\\nPlus d'infos ici: ${{ steps.create_release.outputs.html_url }}\"}" > mattermost.json
          curl -X POST -H 'Content-Type: application/json' -d @mattermost.json "${{ env.MATTERMOST_RELEASE_URL }}"
