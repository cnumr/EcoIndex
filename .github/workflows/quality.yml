name: Validation du build

on: [pull_request]

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Install runtimes
        run: mise install
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check ecoindex_reference sync
        run: bun run reference:check
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
