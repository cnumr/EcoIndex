name: Validation du build

on: [pull_request]

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup mise
        uses: jdx/mise-action@v2
      - name: Install runtimes
        run: mise install
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check ecoindex_reference sync
        run: bun run reference:check
      - name: Format check
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
